name: Publish rankings to GitHub Pages

on:
  push:
    branches: [main]
  # Hourly fallback; cron-job.org triggers workflow_dispatch every 5 minutes
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit the hourly history file
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # include history committed by earlier runs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Keep rankings.db between runs so change tracking has history
      - name: Restore rankings database
        uses: actions/cache@v4
        with:
          path: data/rankings.db
          key: rankings-db-${{ github.run_id }}
          restore-keys: rankings-db-
      - name: Fetch rankings
        run: python -m src.scheduler --once
      - name: Record hourly rankings
        run: |
          # Commit once per hour; the current hour's range stays in the cached database
          added=$(python -m src.history)
          if [ "$added" != "0" ]; then
            git add data/hourly_rankings.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record hourly rankings"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Build static site
        run: python -m src.build_static --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
