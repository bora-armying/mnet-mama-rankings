name: Publish rankings to GitHub Pages

on:
  push:
    branches: [main]
  # Hourly fallback; cron-job.org triggers workflow_dispatch every 5 minutes
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Keep rankings.db between runs so change tracking has history
      - name: Restore rankings database
        uses: actions/cache@v4
        with:
          path: data/rankings.db
          key: rankings-db-${{ github.run_id }}
          restore-keys: rankings-db-
      - name: Fetch rankings
        run: python -m src.scheduler --once
      - name: Build static site
        run: python -m src.build_static --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
